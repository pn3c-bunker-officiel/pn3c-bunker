<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>PN3C BUNKER</title>
<style>
body{background:#0a0a0a;color:#FFD700;font-family:Arial,sans-serif;padding:15px;text-align:center;margin:0}
h1{margin:10px 0;font-size:24px}
.card{background:#1a1a1a;border:1px solid #FFD700;border-radius:20px;padding:20px;margin:15px 0}
.btn{width:100%;padding:18px;border-radius:15px;border:none;font-weight:bold;font-size:16px;margin:8px 0;display:block;text-decoration:none;cursor:pointer}
.btn-red{background:#FF0000;color:white}
.btn-gold{background:#FFD700;color:black}
.btn-black{background:#000;color:#FFD700;border:2px solid #FFD700}
input{width:90%;padding:12px;border-radius:10px;border:1px solid #FFD700;background:#000;color:#FFD700;margin:5px}
#pos{font-size:12px;color:#aaa;margin-top:10px;word-break:break-all}
</style>
</head>
<body>
<h1>🛡️ PN3C BUNKER</h1>
<p style="font-size:12px">Protégé par Jésus-Christ // Opérationnel</p>

<div class="card">
<h3>🚨 URGENCE</h3>
<button class="btn btn-red" onclick="sos()">🚨 ALERTE SOS + MA POSITION</button>
<button class="btn btn-black" onclick="getPosition()">📍 VOIR MA POSITION (TRACKER)</button>
<div id="pos">Position non chargée</div>
</div>

<div class="card">
<h3>📢 GROUPE WHATSAPP</h3>
<button class="btn btn-gold" onclick="alerteGroupe()">📢 ENVOYER ALERTE AU GROUPE PN3C</button>
<a id="waLink" class="btn btn-black" href="https://chat.whatsapp.com/TON-LIEN-GROUPE-ICI" target="_blank">💬 OUVRIR LE GROUPE WHATSAPP</a>
<p style="font-size:11px;color:#aaa">Remplace le lien du groupe dans le code après</p>
</div>

<div class="card">
<h3>🔐 MON COFFRE SECRET</h3>
<input type="password" id="code" placeholder="Tape ton code secret">
<button class="btn btn-black" onclick="sauver()">🔒 CACHER DANS LE COFFRE</button>
<button class="btn btn-black" onclick="voir()">👁️ VOIR MON COFFRE</button>
<div id="coffreMsg" style="font-size:13px;margin-top:10px"></div>
</div>

<script>
let lat="", lon="";
function getPosition(){
  document.getElementById('pos').innerText="Chargement GPS...";
  navigator.geolocation.getCurrentPosition(p=>{
    lat=p.coords.latitude; lon=p.coords.longitude;
    document.getElementById('pos').innerHTML=`✅ Position trouvée:<br>${lat}, ${lon}<br><a style="color:#FFD700" target="_blank" href="https://www.google.com/maps?q=${lat},${lon}">Voir sur Google Maps</a>`;
  }, e=>{ document.getElementById('pos').innerText="GPS refusé. Active le GPS de ton téléphone!"; });
}

function sos(){
  let msg = prompt("Quel est le danger? (ex: besoin d'aide à Cocody)");
  if(!msg) return;
  getPosition();
  setTimeout(()=>{
    let text = `🚨 SOS PN3C BUNKER 🚨\n${msg}\nMa position: https://www.google.com/maps?q=${lat},${lon}\nEnvoyé depuis BUNKER App`;
    // LIEN WHATSAPP API
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
  },1500);
}

function alerteGroupe(){
  let msg = prompt("Message pour tout le groupe PN3C:");
  if(!msg) return;
  let text = `📢 ALERTE PN3C BUNKER\n${msg}\nhttps://pn3c-bunker-officiel.github.io/pn3c-bunker/`;
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
}

function sauver(){
  let c=document.getElementById('code').value;
  if(!c) return alert("Tape un code!");
  localStorage.setItem('pn3c_coffre', c);
  document.getElementById('coffreMsg').innerText="✅ Caché! Même si on vole ton tel, sans l'app on ne peut pas voir.";
  document.getElementById('code').value="";
}
function voir(){
  let c=localStorage.getItem('pn3c_coffre');
  document.getElementById('coffreMsg').innerText= c ? "🔓 Ton secret: "+c : "Coffre vide";
}
getPosition();
</script>
</body>
</html>
