<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PN3C BUNKER - SOS</title>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:12px;margin:0}
.card{background:#111;border:1px solid #333;border-radius:12px;padding:14px;margin-bottom:12px}
input,textarea{width:100%;padding:12px;border-radius:8px;border:1px solid #555;background:#000;color:#fff;box-sizing:border-box;font-size:16px}
button{width:100%;padding:14px;border:none;border-radius:8px;font-weight:bold;font-size:16px;margin-top:8px}
.btn-red{background:#ff0000;color:#fff}
.btn-orange{background:#ff6600;color:#fff}
.btn-blue{background:#0066ff;color:#fff}
.status{font-size:12px;color:#aaa}
</style>
</head>
<body>
<h2 style="text-align:center;color:#ff0000">🛡️ PN3C BUNKER - SOS</h2>

<div class="card" style="border-color:#ff0000">
<h3 style="color:#ff0000;margin:0 0 8px 0;text-align:center">🚨 NUMERO D'URGENCE PERSO</h3>
<p style="font-size:11px;color:#aaa;margin:0 0 8px 0;text-align:center">Ce numéro reçoit l'alerte en même temps que le CCO</p>
<input id="numPerso" type="tel" placeholder="Ex: 2250700000000">
<button class="btn-red" onclick="saveNumPerso()">💾 ENREGISTRER CE NUMERO</button>
<p id="numPersoStatus" style="color:#0f0;font-size:12px;text-align:center;margin-top:8px"></p>
</div>

<div class="card">
<p id="status" class="status">📡 Recherche GPS...</p>
<p>LAT: <span id="lat">--</span> | LON: <span id="lon">--</span> | <span id="acc">--</span></p>
<button class="btn-blue" onclick="sharePos()">📍 PARTAGER POSITION</button>
</div>

<div class="card">
<h3 style="color:#ff0000">🚨 SOS URGENCE</h3>
<textarea id="msgSOS" rows="3" placeholder="Ex: Besoin aide immédiate, je suis en danger..."></textarea>
<button class="btn-red" onclick="sendSOS()">🚨 LANCER SOS (2 ALERTES)</button>
<p style="font-size:10px;color:#aaa;margin-top:6px">Envoie vers: 1. Ton numéro d'urgence perso + 2. CCO PN3C pour analyse et transfert aux secours</p>
</div>

<div class="card">
<h3 style="color:#ff9900">⚠️ ALERTE</h3>
<textarea id="msgAlerte" rows="2" placeholder="Signalement..."></textarea>
<button class="btn-orange" onclick="sendAlerte()">⚠️ LANCER ALERTE</button>
</div>

<script src="app.js"></script>
</body>
</html>
